  <!-- Scripts -->
  <script>
    const SUPABASE_URL = "https://firmyknalxgtmgnxmtdo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_UpfYT4yKOBgcU3P5FDxcMw_IasiYca_";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ADMIN_PIN = "123456";
    let allOrders = [];

    function handleAdminLogin(e) {
      e.preventDefault();
      if (document.getElementById('adminPass').value === ADMIN_PIN) {
        document.getElementById('loginScreen').classList.add('hidden');
        initDashboard();
      } else {
        alert("ভুল পিন কোড!");
      }
    }

    function logoutAdmin() { location.reload(); }
    function toggleMobileSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }

    function switchTab(tabName) {
      ['dashboard', 'orders', 'delivery', 'products', 'settings'].forEach(t => {
        const el = document.getElementById('tab-' + t);
        const btn = document.getElementById('nav-' + t);
        if (el) el.classList.add('hidden');
        if (btn) btn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-zinc-400 hover:bg-[#13131A] hover:text-white transition text-left text-xs font-semibold";
      });

      const activeTab = document.getElementById('tab-' + tabName);
      const activeBtn = document.getElementById('nav-' + tabName);
      if (activeTab) activeTab.classList.remove('hidden');
      if (activeBtn) activeBtn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-[#FF5A00] text-white transition text-left text-xs font-semibold shadow-lg shadow-[#FF5A00]/25";
      
      document.getElementById('pageTitle').innerText = tabName.toUpperCase();
      if (window.innerWidth < 768) toggleMobileSidebar();
    }

    async function initDashboard() {
      await fetchOrders();
      await fetchStockCount();
    }

    async function fetchStockCount() {
      const { count } = await supabaseClient.from('stock_pool').select('*', { count: 'exact', head: true }).eq('is_used', false);
      const val = count || 0;
      document.getElementById('statStock').innerText = val;
      const unused = document.getElementById('unusedStockCount');
      if (unused) unused.innerText = val;
    }

    async function addStockLinks() {
      const input = document.getElementById('stockInput');
      const lines = input.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (!lines.length) return alert("অনুগ্রহ করে অন্তত ১টি লিঙ্ক পেস্ট করুন!");

      const insertData = lines.map(link => ({ item_link: link, is_used: false }));
      const { error } = await supabaseClient.from('stock_pool').insert(insertData);
      if (error) alert("ব্যর্থ: " + error.message);
      else {
        alert(`${lines.length}টি লিঙ্ক সফলভাবে স্টকে জমা হয়েছে!`);
        input.value = "";
        fetchStockCount();
      }
    }

    async function fetchOrders() {
      const tbody = document.getElementById('ordersTableBody');
      const { data: orders, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });

      if (error || !orders || !orders.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-zinc-500">কোনো অর্ডার পাওয়া যায়নি।</td></tr>`;
        return;
      }

      allOrders = orders;
      let pending = 0, revenue = 0;
      orders.forEach(o => {
        if (o.status === 'Pending') pending++;
        if (o.status === 'Delivered') revenue += Number(o.amount || 250);
      });

      document.getElementById('statTotalOrders').innerText = orders.length;
      document.getElementById('statPendingOrders').innerText = pending;
      document.getElementById('statRevenue').innerText = revenue + " ৳";
      document.getElementById('orderBadge').innerText = pending;

      renderOrdersTable(orders);
    }

    function renderOrdersTable(list) {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = list.map(o => `
        <tr class="hover:bg-[#13131A] transition">
          <td class="py-3.5 px-4 font-mono font-bold text-[#FF5A00]">${o.order_code}</td>
          <td class="py-3.5 px-4"><b class="text-white">${o.customer_name}</b><br><span class="text-[10px] text-zinc-400 font-mono">${o.whatsapp_number}</span></td>
          <td class="py-3.5 px-4 font-mono text-[11px]">${o.customer_email}</td>
          <td class="py-3.5 px-4"><span>${o.payment_method}</span><br><b class="font-mono text-zinc-400">${o.trx_id}</b></td>
          <td class="py-3.5 px-4">
            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${o.status === 'Delivered' ? 'neon-pill-delivered' : 'neon-pill-pending'}">
              ${o.status}
            </span>
          </td>
          <td class="py-3.5 px-4 text-right">
            ${o.status === 'Pending' ? `
              <button onclick="approveAndDeliver('${o.id}', '${o.order_code}', '${o.customer_name}', '${o.whatsapp_number}')" class="bg-[#FF5A00] hover:bg-[#E04E00] text-white font-bold px-3 py-1.5 rounded-xl text-[11px] transition inline-flex items-center gap-1 shadow-[0_0_15px_rgba(255,90,0,0.4)]">
                <i class="fa-brands fa-whatsapp"></i> ডেলিভারি দিন
              </button>
            ` : `<span class="text-emerald-400 text-xs font-semibold flex items-center justify-end gap-1"><i class="fa-solid fa-circle-check"></i> সম্পন্ন</span>`}
          </td>
        </tr>
      `).join('');
    }

    function filterOrders() {
      const q = document.getElementById('orderSearch').value.toLowerCase();
      const filtered = allOrders.filter(o => 
        (o.customer_name && o.customer_name.toLowerCase().includes(q)) || 
        (o.trx_id && o.trx_id.toLowerCase().includes(q)) ||
        (o.order_code && o.order_code.toLowerCase().includes(q))
      );
      renderOrdersTable(filtered);
    }

    // ১০০% ফিক্সড ১-ক্লিক হোয়াটসঅ্যাপ অটো ডেলিভারি
    async function approveAndDeliver(orderId, orderCode, customerName, phone) {
      if (!confirm(`${customerName}-এর অর্ডারটি স্টক লিঙ্ক তুলে WhatsApp-এ ডেলিভারি করবেন?`)) return;

      const { data: stockItem, error: stockErr } = await supabaseClient
        .from('stock_pool')
        .select('*')
        .eq('is_used', false)
        .limit(1)
        .single();

      if (stockErr || !stockItem) {
        return alert("⚠️ স্টকে কোনো অ্যাক্টিভেশন লিঙ্ক নেই! আগে Delivery Management থেকে লিঙ্ক যোগ করুন।");
      }

      await supabaseClient
        .from('stock_pool')
        .update({ is_used: true, used_at: new Date().toISOString() })
        .eq('id', stockItem.id);

      const { error: orderErr } = await supabaseClient
        .from('orders')
        .update({ status: 'Delivered', delivered_link: stockItem.item_link })
        .eq('id', orderId);

      if (orderErr) {
        return alert("স্ট্যাটাস আপডেট হয়নি: " + orderErr.message);
      }

      const customMsg = `সম্মানিত ${customerName},
Subs Mart BD থেকে Gemini Pro (18 Months) প্যাকেজটি নেওয়ার জন্য ধন্যবাদ! আপনার পেমেন্ট ভেরিফাই হয়েছে।

🔗 আপনার অ্যাক্টিভেশন লিঙ্ক:
${stockItem.item_link}

📌 অর্ডার কোড: ${orderCode}
মেয়াদ: ১৮ মাস

যেইভাবে অফার এক্টিভেট করবেন 👇
১. লিংক কপি করবেন 
২. ক্রোম ব্রাউজারে পেস্ট করবেন 
৩. উপরে ডান দিক থেকে প্রোফাইল সিলেক্ট করবেন 
৪. নিচে একটিভ বাটনে চাপ দিবেন 
৫. Done 🥳🎉

⭐ সার্ভিস কেমন লাগলো জানাতে রিভিউ দিন: https://websubs-three.vercel.app/review.html
যেকোনো সহায়তায় আমাদের এই নম্বরেই মেসেজ দিতে পারেন। শুভকামনা!`;

      let cleanPhone = phone.replace(/[^0-9]/g, '');
      if (cleanPhone.startsWith('01')) cleanPhone = '88' + cleanPhone;

      window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(customMsg)}`, '_blank');
      await initDashboard();
    }
  </script>
</body>
