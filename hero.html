<!-- Hero Section (Full-Screen Packed & Bold Reference Match) -->
<section class="max-w-4xl mx-auto px-3 pt-2 pb-6">
  
  <!-- টপ সেকশন: বামে বড় টেক্সট ও প্রাইস, ডানে বড় মডেল (স্ক্রিন জুড়ে জমজমাট) -->
  <div class="grid grid-cols-12 gap-1 items-end">
    
    <!-- বাম পাশ (৫০% - বড় টেক্সট, হেডলাইন ও ডুয়াল-টোন ক্যাপসুল) -->
    <div class="col-span-7 sm:col-span-7 text-left space-y-2 pb-1 pr-1 z-10">
      
      <!-- Google AI Pro Badge -->
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#14141A] border border-[#FF5A00]/50 text-xs font-bold text-[#FF5A00] shadow-sm">
        <span class="text-blue-500 font-black font-en">G</span>
        <span>Google AI Pro</span>
        <span class="text-purple-400 text-sm">✦</span>
      </div>

      <!-- Headlines (১৮ মাসের < জেমিনি প্রো > পার্সোনাল একাউন্ট) -->
      <div class="space-y-0.5 leading-none">
        <!-- ১. ১৮ মাসের -->
        <h2 class="text-3xl sm:text-5xl font-black text-[#FF5A00] tracking-tight">
          ১৮ মাসের
        </h2>
        
        <!-- ২. জেমিনি প্রো (আরেকটু বড় ও ভারী বোল্ড) -->
        <h1 class="text-4xl sm:text-6xl font-black text-white tracking-tight pt-1">
          জেমিনি প্রো
        </h1>
        
        <!-- ৩. পার্সোনাল একাউন্ট (তার চেয়ে ছোট) -->
        <p class="text-xs sm:text-lg font-bold text-zinc-300 pt-1 tracking-wide">
          পার্সোনাল একাউন্ট
        </p>
      </div>

      <!-- Glowing Dual-Tone Price Capsule (বাম ডার্ক + ডানে বড় উজ্জ্বল ২৫০৳) -->
      <div class="pt-2 relative inline-block">
        <!-- ৩টি স্পার্কল রে -->
        <span class="absolute -top-3.5 -right-2 text-[#FF5A00] font-black text-base select-none pointer-events-none tracking-tighter">
          \ | /
        </span>
        
        <div class="flex items-center rounded-full p-1 bg-[#1a0a03] border-2 border-[#FF5A00] shadow-[0_0_35px_rgba(255,90,0,0.8)]">
          <!-- বাম পাশের ডার্ক রাউন্ডেড অংশ (মাত্র) -->
          <div class="flex items-center gap-1 px-3 py-1 rounded-full bg-[#0d0502] border border-[#FF5A00]/40 text-xs sm:text-sm font-bold text-zinc-200">
            <span class="text-xs">🏷️</span>
            <span>মাত্র</span>
          </div>
          <!-- ডান পাশের বড় বোল্ড ব্রাইট অংশ (২৫০ ৳) -->
          <div class="px-3.5 py-0.5 text-white font-black text-2xl sm:text-4xl font-en tracking-tight">
            ২৫০ ৳
          </div>
        </div>
      </div>

    </div>

    <!-- ডান পাশ (৫০% - বড় মডেল যার কোমর একদম টাইমারের সাথে লাগানো) -->
    <div class="col-span-5 sm:col-span-5 flex justify-end items-end relative overflow-visible">
      <!-- পেছনের গোল্ডেন-অরেঞ্জ নিয়ন সার্কেল রিং -->
      <div class="absolute top-2 right-2 w-40 h-40 sm:w-64 sm:h-64 rounded-full border-2 border-[#FF5A00] shadow-[0_0_60px_rgba(255,90,0,0.7)] bg-gradient-to-tr from-[#FF5A00]/30 to-amber-500/10 pointer-events-none"></div>
      
      <!-- বড় ট্রান্সপারেন্ট ছেলেটির ছবি (স্ক্রিন জুড়ে এবং টাইমারের সাথে লাগানো) -->
      <img src="hero-boy.png" alt="Hero Character" class="relative z-10 w-full max-h-[260px] sm:max-h-[380px] object-contain object-bottom -mb-1 scale-105 origin-bottom drop-shadow-[0_15px_25px_rgba(0,0,0,0.9)]" onerror="this.src='https://placehold.co/300x300/121216/FF5A00?text=Model';">
    </div>

  </div>

  <!-- কাউন্টডাউন টাইমার বক্স (বড় বোল্ড সংখ্যা সহ) -->
  <div class="relative z-20 bg-[#121216] border border-[#FF5A00]/50 rounded-2xl p-3 sm:p-4 text-center shadow-2xl mt-0">
    <span class="text-xs sm:text-sm font-bold text-[#FF5A00] flex items-center justify-center gap-1.5 mb-2">
      <i class="fa-regular fa-clock"></i> অফার শেষ হতে বাকি
    </span>
    <div class="grid grid-cols-4 gap-2 text-center font-en">
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="days" class="text-2xl sm:text-4xl font-black block text-white leading-tight">07</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">দিন</span>
      </div>
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="hours" class="text-2xl sm:text-4xl font-black block text-white leading-tight">12</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">ঘণ্টা</span>
      </div>
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="mins" class="text-2xl sm:text-4xl font-black block text-white leading-tight">30</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">মিনিট</span>
      </div>
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="secs" class="text-2xl sm:text-4xl font-black block text-[#FF5A00] leading-tight">26</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">সেকেন্ড</span>
      </div>
    </div>
  </div>

  <!-- ট্রাস্ট ব্যাজ -->
  <div class="flex items-center justify-center gap-6 text-xs text-zinc-400 py-3 font-semibold">
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-[#FF5A00]"></i> ফাস্ট ডেলিভারি</span>
    <span class="text-zinc-600">|</span>
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-blue-400"></i> নিরাপদ পেমেন্ট</span>
  </div>

  <!-- দুটি বড় বাটন (Order Now & WhatsApp) -->
  <div class="grid grid-cols-2 gap-3">
    <a href="#order" class="bg-[#FF5A00] hover:bg-[#E04E00] text-white py-3.5 px-3 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-[0_10px_25px_rgba(255,90,0,0.35)] transition transform hover:-translate-y-0.5">
      <i class="fa-solid fa-cart-shopping"></i> Order Now →
    </a>
    <a href="https://wa.me/8801985405068" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 px-3 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-[0_10px_25px_rgba(16,185,129,0.35)] transition transform hover:-translate-y-0.5">
      <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp মেসেজ →
    </a>
  </div>

</section>
