<!-- Top Header (Logo, Subs Mart BD, Light/Dark Toggle) -->
<header class="border-b border-[#2A2A36] bg-[#08080A]/95 backdrop-blur sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-3 py-2 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-full overflow-hidden border border-[#FF5A00]/50 flex items-center justify-center bg-zinc-900 shadow">
        <img src="logo.png" alt="Subs Mart Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/40x40/FF5A00/white?text=SM';">
      </div>
      <div>
        <span class="font-en font-black text-base tracking-wide text-white">Subs Mart <span class="text-[#FF5A00]">BD</span></span>
        <p class="text-[8px] text-zinc-400 font-en uppercase -mt-1 tracking-wider">Premium Subscriptions</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleTheme()" class="flex items-center bg-zinc-800 p-1 rounded-full text-[10px] font-bold shadow-sm">
        <span id="lightPill" class="px-2 py-0.5 rounded-full flex items-center gap-1 text-zinc-400">
          <i class="fa-solid fa-sun text-amber-500"></i> Light
        </span>
        <span id="darkPill" class="px-2 py-0.5 rounded-full flex items-center gap-1 bg-[#FF5A00] text-white shadow">
          <i class="fa-solid fa-moon"></i> Dark
        </span>
      </button>
    </div>
  </div>
</header>

<!-- Hero Section (Jam-Packed, Zero-Gap & Massive Character) -->
<section class="max-w-4xl mx-auto px-3 pt-2 pb-6 overflow-hidden">
  
  <!-- মেইন হিরো রো: বামে বড় টেক্সট, ডানে বড় ছেলেটি (গায়ে গায়ে লাগানো) -->
  <div class="flex items-end justify-between relative overflow-visible min-h-[260px] sm:min-h-[340px]">
    
    <!-- বাম পাশ: টেক্সট (কোনো গ্যাপ ছাড়া বিশাল বড় ফন্ট) -->
    <div class="w-[52%] z-10 flex flex-col justify-end pb-1 pr-0 text-left">
      
      <!-- Google AI Pro Badge -->
      <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-[#14141A] border border-[#FF5A00]/50 text-xs font-bold text-[#FF5A00] w-fit mb-1.5 shadow-sm">
        <span class="text-blue-500 font-black font-en">G</span>
        <span>Google AI Pro</span>
        <span class="text-purple-400 text-xs">✦</span>
      </div>

      <!-- Headlines: গ্যাপ ছাড়া একদম গায়ে গায়ে বড় টেক্সট -->
      <div class="flex flex-col">
        <span class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#FF5A00] via-amber-400 to-[#FF8C33] leading-[0.95] tracking-tight">
          ১৮ মাসের
        </span>
        <span class="text-4xl sm:text-6xl font-black text-white leading-[0.95] tracking-tight -mt-0.5 sm:-mt-1">
          জেমিনি প্রো
        </span>
        <span class="text-sm sm:text-xl font-black text-zinc-200 leading-tight mt-1 tracking-wide">
          পার্সোনাল একাউন্ট
        </span>
      </div>

      <!-- Glowing Price Capsule (🏷️ মাত্র ২৫০ ৳) -->
      <div class="mt-2.5 relative inline-block w-fit">
        <!-- ৩টি আসল গ্রাফিক্স স্পার্কল রে -->
        <svg class="absolute -top-3.5 -right-2 w-7 h-7 text-[#FF5A00] drop-shadow-[0_0_8px_#FF5A00] pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L13 7H11L12 2ZM4.93 6.34L8.88 9.38L7.47 10.79L3.52 7.75L4.93 6.34ZM19.07 6.34L20.48 7.75L16.53 10.79L15.12 9.38L19.07 6.34Z"/>
        </svg>

        <!-- ডুয়াল-টোন ক্যাপসুল -->
        <div class="flex items-center rounded-full p-1 bg-gradient-to-r from-[#FF4500] via-[#FF5A00] to-[#FFA500] shadow-[0_0_35px_rgba(255,90,0,0.85)] border border-amber-300/60">
          <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-[#110601] border border-orange-500/40 text-xs font-bold text-white shadow-inner">
            <span class="text-xs">🏷️</span>
            <span>মাত্র</span>
          </div>
          <div class="px-3 py-0 text-white font-black text-2xl sm:text-4xl font-en tracking-tight drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]">
            ২৫০ ৳
          </div>
        </div>
      </div>

    </div>

    <!-- ডান পাশ: ছেলেটির ছবি (বিশাল বড়, স্ক্রিন জুড়ে এবং টাইমারের সাথে লাগানো) -->
    <div class="w-[52%] -ml-[4%] relative flex items-end justify-end overflow-visible">
      <!-- পেছনের সফট সানসেট অরেঞ্জ গ্লো ও হ্যালো রিং -->
      <div class="absolute -right-2 top-0 w-44 h-44 sm:w-64 sm:h-64 rounded-full bg-gradient-to-br from-[#FF5A00] via-[#FF3300]/40 to-transparent blur-xl opacity-80 pointer-events-none"></div>
      <div class="absolute -right-1 top-0 w-40 h-40 sm:w-60 sm:h-60 rounded-full border-[2.5px] border-[#FF6A00] shadow-[0_0_35px_#FF5A00] opacity-85 pointer-events-none"></div>

      <!-- অনেক বড় স্কেল করা ছেলেটির ছবি -->
      <img src="hero-boy.png" alt="Hero Character" class="relative z-10 w-full h-auto object-contain object-bottom -mb-1 scale-120 sm:scale-130 origin-bottom-right drop-shadow-[0_15px_30px_rgba(0,0,0,0.95)]" onerror="this.src='https://placehold.co/350x400/121216/FF5A00?text=Model';">
    </div>

  </div>

  <!-- কাউন্টডাউন টাইমার বক্স (বড় সংখ্যা সহ) -->
  <div class="relative z-20 bg-[#121216] border border-[#FF5A00]/50 rounded-2xl p-3 sm:p-4 text-center shadow-2xl mt-0">
    <span class="text-xs sm:text-sm font-bold text-[#FF5A00] flex items-center justify-center gap-1.5 mb-2">
      <i class="fa-regular fa-clock"></i> অফার শেষ হতে বাকি
    </span>
    <div class="grid grid-cols-4 gap-2 text-center font-en">
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="days" class="text-2xl sm:text-4xl font-black block text-white leading-tight">07</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">দিন</span>
      </div>
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="hours" class="text-2xl sm:text-4xl font-black block text-white leading-tight">12</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">ঘণ্টা</span>
      </div>
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="mins" class="text-2xl sm:text-4xl font-black block text-white leading-tight">30</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">মিনিট</span>
      </div>
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="secs" class="text-2xl sm:text-4xl font-black block text-[#FF5A00] leading-tight">06</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">সেকেন্ড</span>
      </div>
    </div>
  </div>

  <!-- ট্রাস্ট ব্যাজ -->
  <div class="flex items-center justify-center gap-6 text-xs text-zinc-400 py-3 font-semibold">
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-[#FF5A00]"></i> ফাস্ট ডেলিভারি</span>
    <span class="text-zinc-600">|</span>
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-blue-400"></i> নিরাপদ পেমেন্ট</span>
  </div>

  <!-- দুটি বড় বাটন (Order Now & WhatsApp) -->
  <div class="grid grid-cols-2 gap-3">
    <a href="#order" class="bg-[#FF5A00] hover:bg-[#E04E00] text-white py-3.5 px-3 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-[0_10px_25px_rgba(255,90,0,0.35)] transition transform hover:-translate-y-0.5">
      <i class="fa-solid fa-cart-shopping"></i> Order Now →
    </a>
    <a href="https://wa.me/8801985405068" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 px-3 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-[0_10px_25px_rgba(16,185,129,0.35)] transition transform hover:-translate-y-0.5">
      <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp মেসেজ →
    </a>
  </div>

</section>
