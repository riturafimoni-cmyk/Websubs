<!-- Top Header (Logo, Brand Name, Light/Dark Mode) -->
<header class="border-b border-[#2A2A36] bg-[#08080A]/95 backdrop-blur sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-full overflow-hidden border border-[#FF5A00]/40 flex items-center justify-center bg-zinc-900 shadow">
        <img src="logo.png" alt="Subs Mart Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/40x40/FF5A00/white?text=SM';">
      </div>
      <div>
        <span class="font-en font-extrabold text-sm sm:text-base tracking-wide text-white">Subs Mart <span class="text-[#FF5A00]">BD</span></span>
        <p class="text-[8px] sm:text-[9px] text-zinc-400 font-en uppercase -mt-0.5 tracking-wider">Premium Subscriptions</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleTheme()" class="flex items-center bg-zinc-800 p-1 rounded-full text-[10px] sm:text-[11px] font-bold shadow-sm">
        <span id="lightPill" class="px-2 py-0.5 rounded-full flex items-center gap-1 text-zinc-400">
          <i class="fa-solid fa-sun text-amber-500"></i> Light
        </span>
        <span id="darkPill" class="px-2 py-0.5 rounded-full flex items-center gap-1 bg-[#FF5A00] text-white shadow">
          <i class="fa-solid fa-moon"></i> Dark
        </span>
      </button>
    </div>
  </div>
</header>

<!-- Hero Section (Zero Top-Gap, Big Typography & Massive Model) -->
<section class="max-w-4xl mx-auto px-3 pt-2 pb-6 overflow-hidden">
  
  <!-- মেইন হিরো রো: কোনো ফাঁকা জায়গা ছাড়া ওপর থেকে শুরু -->
  <div class="grid grid-cols-12 gap-1 items-end relative">
    
    <!-- বাম পাশ (উপরে কোনো ফাঁকা নেই, পরিষ্কার বড় লেখা) -->
    <div class="col-span-7 sm:col-span-7 text-left z-10 flex flex-col justify-start pb-2">
      
      <!-- Google AI Pro Badge -->
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#14141A] border border-[#FF5A00]/40 text-xs font-bold text-[#FF5A00] shadow-sm w-fit mb-2">
        <span class="text-blue-500 font-black font-en">G</span>
        <span>Google AI Pro</span>
        <span class="text-purple-400 text-sm">✦</span>
      </div>

      <!-- Headlines: পরিষ্কার, বড় এবং ওভারল্যাপ ছাড়া -->
      <div class="space-y-1">
        <h2 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#FF5A00] via-amber-400 to-[#FF8C33] tracking-tight leading-tight">
          ১৮ মাসের
        </h2>
        <h1 class="text-3xl sm:text-5xl font-black text-white tracking-tight leading-tight">
          জেমিনি প্রো
        </h1>
        <p class="text-xs sm:text-base font-bold text-zinc-300 pt-0.5 tracking-wide">
          পার্সোনাল একাউন্ট
        </p>
      </div>

      <!-- Glowing Price Capsule (শুধু বড় বোল্ড ২৫০ ৳, 'মাত্র' বাদ) -->
      <div class="pt-3">
        <div class="inline-flex items-center justify-center px-6 py-2 rounded-full bg-gradient-to-r from-[#FF5A00] via-[#FF4500] to-[#E04E00] border-2 border-amber-300/80 shadow-[0_0_35px_rgba(255,90,0,0.85)]">
          <span class="text-white font-black text-2xl sm:text-4xl font-en tracking-wider drop-shadow-md">
            ২৫০ ৳
          </span>
        </div>
      </div>

    </div>

    <!-- ডান পাশ: নীল দাগ অনুযায়ী বিশাল বড় ও লম্বা ছেলেটির ছবি -->
    <div class="col-span-5 sm:col-span-5 flex justify-end items-end relative overflow-visible">
      <!-- পেছনের সফট সানসেট নিয়ন আভা -->
      <div class="absolute -right-3 top-0 w-48 h-48 sm:w-72 sm:h-72 rounded-full bg-gradient-to-br from-[#FF5A00] via-[#FF3300]/40 to-transparent blur-xl opacity-80 pointer-events-none"></div>
      <div class="absolute -right-2 top-0 w-44 h-44 sm:w-64 sm:h-64 rounded-full border-[2.5px] border-[#FF6A00] shadow-[0_0_40px_#FF5A00] opacity-85 pointer-events-none"></div>

      <!-- স্কেল করা বড় ছেলেটির ছবি -->
      <img src="hero-boy.png" alt="Hero Character" class="relative z-10 w-full h-auto object-contain object-bottom -mb-1 scale-125 sm:scale-135 origin-bottom-right drop-shadow-[0_15px_30px_rgba(0,0,0,0.95)]" onerror="this.src='https://placehold.co/350x450/121216/FF5A00?text=Model';">
    </div>

  </div>

  <!-- কাউন্টডাউন টাইমার বক্স (বোল্ড সংখ্যা) -->
  <div class="relative z-20 bg-[#121216] border border-[#FF5A00]/50 rounded-2xl p-3 sm:p-4 text-center shadow-2xl mt-0">
    <span class="text-xs sm:text-sm font-bold text-[#FF5A00] flex items-center justify-center gap-1.5 mb-2">
      <i class="fa-regular fa-clock"></i> অফার শেষ হতে বাকি
    </span>
    <div class="grid grid-cols-4 gap-2 text-center font-en">
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="days" class="text-2xl sm:text-4xl font-black block text-white leading-tight">07</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">দিন</span>
      </div>
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="hours" class="text-2xl sm:text-4xl font-black block text-white leading-tight">12</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">ঘণ্টা</span>
      </div>
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="mins" class="text-2xl sm:text-4xl font-black block text-white leading-tight">30</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">মিনিট</span>
      </div>
      <div class="bg-[#08080A] py-2 px-1 rounded-xl border border-zinc-800">
        <span id="secs" class="text-2xl sm:text-4xl font-black block text-[#FF5A00] leading-tight">06</span>
        <span class="text-[9px] sm:text-xs text-zinc-400 font-sans font-bold">সেকেন্ড</span>
      </div>
    </div>
  </div>

  <!-- ট্রাস্ট ব্যাজ -->
  <div class="flex items-center justify-center gap-6 text-xs text-zinc-400 py-3 font-semibold">
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-[#FF5A00]"></i> ফাস্ট ডেলিভারি</span>
    <span class="text-zinc-600">|</span>
    <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-blue-400"></i> নিরাপদ পেমেন্ট</span>
  </div>

  <!-- দুটি বড় বাটন (Order Now & WhatsApp) -->
  <div class="grid grid-cols-2 gap-3">
    <a href="#order" class="bg-[#FF5A00] hover:bg-[#E04E00] text-white py-3.5 px-3 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-[0_10px_25px_rgba(255,90,0,0.35)] transition transform hover:-translate-y-0.5">
      <i class="fa-solid fa-cart-shopping"></i> Order Now →
    </a>
    <a href="https://wa.me/8801985405068" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 px-3 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shadow-[0_10px_25px_rgba(16,185,129,0.35)] transition transform hover:-translate-y-0.5">
      <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp মেসেজ →
    </a>
  </div>

</section>
