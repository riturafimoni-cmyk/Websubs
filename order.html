<!-- Order & Checkout Section with Send Money & Supabase -->
<section id="order" class="max-w-3xl mx-auto px-3 py-8">
  <div class="bg-[#121216] border border-[#FF5A00]/50 rounded-3xl p-5 sm:p-7 shadow-2xl">
    
    <div class="text-center mb-5">
      <h3 class="text-xl sm:text-2xl font-bold text-white">অর্ডার ও পেমেন্ট কনফার্মেশন</h3>
      <p class="text-xs text-zinc-400 mt-0.5">প্যাকেজ মূল্য: <b class="text-[#FF5A00] font-en text-sm">২৫০ ৳</b> (১৮ মাস)</p>
    </div>

    <form id="orderForm" onsubmit="submitCustomerOrder(event)" class="space-y-3 text-xs">
      <div>
        <label class="block text-zinc-300 font-semibold mb-1">আপনার নাম *</label>
        <input type="text" id="custName" required placeholder="পুরো নাম" class="w-full bg-[#08080A] border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white focus:border-[#FF5A00] outline-none">
      </div>

      <div>
        <label class="block text-zinc-300 font-semibold mb-1">যে জিমেইলে এক্সেস নিবেন (Gmail) *</label>
        <input type="email" id="custEmail" required placeholder="example@gmail.com" class="w-full bg-[#08080A] border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white focus:border-[#FF5A00] outline-none">
      </div>

      <div>
        <label class="block text-zinc-300 font-semibold mb-1">হোয়াটসঅ্যাপ নাম্বার *</label>
        <input type="tel" id="custPhone" required placeholder="01XXXXXXXXX" class="w-full bg-[#08080A] border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white focus:border-[#FF5A00] outline-none">
      </div>

      <div>
        <label class="block text-zinc-300 font-semibold mb-1">পেমেন্ট মেথড (সেন্ড মানি করুন) *</label>
        <select id="payMethod" onchange="updatePayNum()" class="w-full bg-[#08080A] border border-zinc-800 rounded-xl px-3 py-2.5 text-white focus:border-[#FF5A00] outline-none">
          <option value="bKash">বিকাশ Personal (সেন্ড মানি - Send Money)</option>
          <option value="Nagad">নগদ Personal (সেন্ড মানি - Send Money)</option>
        </select>
      </div>

      <!-- Number Display Box -->
      <div class="bg-[#08080A] border border-zinc-800 p-2.5 rounded-xl flex items-center justify-between">
        <div>
          <span id="methodLabel" class="text-[10px] text-zinc-400 block font-semibold">bKash (সেন্ড মানি):</span>
          <b id="activeNum" class="text-sm font-mono text-white tracking-wide">01985405068</b>
        </div>
        <button type="button" onclick="copyActiveNum(this)" class="bg-[#FF5A00] text-white px-2.5 py-1 rounded-lg text-xs font-bold transition">কপি</button>
      </div>

      <div>
        <label class="block text-zinc-300 font-semibold mb-1">ট্রানজেকশন আইডি (TrxID) *</label>
        <input type="text" id="custTrx" required placeholder="যেমন: BL29X78M" class="w-full bg-[#08080A] border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white uppercase font-mono focus:border-[#FF5A00] outline-none">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-[#FF5A00] hover:bg-[#E04E00] text-white py-3.5 rounded-xl font-bold text-xs sm:text-sm shadow-lg shadow-[#FF5A00]/30 transition">
        অর্ডার কনফার্ম করুন →
      </button>
      <p class="text-[10px] text-center text-zinc-500">🔒 আপনার তথ্য সম্পূর্ণ নিরাপদ থাকবে</p>
    </form>

    <div id="orderSuccess" class="hidden text-center py-5 space-y-2.5">
      <i class="fa-solid fa-circle-check text-4xl text-emerald-500"></i>
      <h4 class="text-base font-bold text-white">অর্ডার ডাটাবেজে জমা হয়েছে!</h4>
      <p class="text-xs text-zinc-400">অর্ডার কোড: <b id="displayOrderCode" class="text-[#FF5A00] font-mono text-sm"></b></p>
      <a id="waSendBtn" href="#" target="_blank" class="inline-flex bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl text-xs gap-2 transition">
        <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp-এ ডেলিভারি নিশ্চিত করুন
      </a>
    </div>

  </div>
</section>
